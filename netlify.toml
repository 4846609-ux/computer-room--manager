# Netlify deployment for the FRONTEND (the screens) only.
# The API + database stay on Render. Point the frontend at the Render API by
# setting NEXT_PUBLIC_API_URL in Netlify → Site settings → Environment variables:
#   NEXT_PUBLIC_API_URL = https://computer-room-manager-api.onrender.com
#
# This repo is a pnpm monorepo, so we install at the root and build the web app.
[build]
  base = "."
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @crm/shared build && pnpm --filter @crm/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

# Official Next.js runtime — handles SSR/routing on Netlify automatically.
[[plugins]]
  package = "@netlify/plugin-nextjs"
