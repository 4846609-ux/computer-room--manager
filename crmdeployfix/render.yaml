# Render Blueprint for Computer Room Manager (API + PostgreSQL).
# Deploy via Render → Blueprints → New Blueprint Instance → pick this repo.
# The web app (frontend) is hosted separately on Netlify, so it is NOT here.
# Redis is optional (only needed if ENABLE_WORKERS=true) and is omitted.
services:
  - type: web
    name: computer-room-manager-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    # The image CMD applies the schema (prisma db push) then starts. On an empty
    # database the API auto-creates the first owner login (see BootstrapService).
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AGENT_SIGNING_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://computer-room-manager-api.onrender.com
      # --- You fill these when applying the Blueprint ---
      - key: CORS_ORIGIN
        sync: false # your Netlify site URL, e.g. https://gorgeous-heliotrope-dde034.netlify.app
      - key: OWNER_EMAIL
        sync: false # the email you'll log in with
      - key: OWNER_PASSWORD
        sync: false # the password you'll log in with
      # Nedarim Plus (fill later; safe to leave blank for now)
      - key: NEDARIM_CALLBACK_MODE
        value: mosad

databases:
  - name: crm-db
    databaseName: crm
    plan: free
