# Render Blueprint for Computer Room Manager (API + PostgreSQL).
# The frontend is on Netlify. Redis is not needed and is omitted.
services:
  - type: web
    name: computer-room-manager-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AGENT_SIGNING_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://computer-room-manager-api.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: NEDARIM_CALLBACK_MODE
        value: mosad

databases:
  - name: crm-db
    databaseName: crm
    plan: free
